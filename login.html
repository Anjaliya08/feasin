<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

</head>
<body>

<div class="col-2 mt-1">
                <i class="fa-regular fa-circle-user"data-bs-toggle="modal" data-bs-target="#loginModal"></i><a href="#" class="" data-bs-toggle="modal" data-bs-target="#loginModal">Login</a>
                
               

            <!-- Login Modal -->
            <div class="modal fade" id="loginModal" tabindex="1" aria-labelledby="loginModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="loginModalLabel">Login</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

                        </div>
                        <div class="modal-body">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="contactNumber" class="form-label">Email Address</label>
               <input type="text" class="form-control" id="email Address" placeholder="Enter your email Address">
                                </div>
                            <div class="mb-3">
                                    <label for="otp" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="pass" placeholder="Enter your Password" required>
                                </div>
                                <button type="submit" class="btn btn-primary">Sign up</button>
                                <button type="submit" class="btn btn-secoundary"><a href="signup.html" class="btn-btn-primary"> Create Account</a></button>


                            </form>
                        </div>
                    </div>
                </div>
                </div>
            </div>

            <script type="text/javascript" src="bootstrap/js/bootstrap.bundle.min.js"></script>
        </body>
        </html>
