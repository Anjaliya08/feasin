<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">

<style>
.e1 {
    background-color: black;
}

.btn-group button {
    background-color: lightgrey;
    color: white;
    padding: 10px 24px;
    cursor: pointer;
    width: 80%;
    display: block;
    border: 1px solid green;
}

.btn-group button:not(:last-child) {
    border-bottom: none;
}

.btn-group button:hover {
    background-color: black;
}

.image-container {
    display: none;
    margin-top: 20px;
}

img {
    height: 500px; 
    width: 400px;
}
</style>
<body>
<center>

    <button onclick="showImage('img3')">BEAUTY FAVES</button>
    <button onclick="showImage('img4')">FOR HER</button>
    <button onclick="showImage('img5')">FOR HIM</button>
</div>

<div id="img1" class="image-container">

</div>
<div id="img3" class="image-container">
    <img src="images/c3.jpg" alt="Beauty Faves">
    <img src="images/c5.jpg" alt="Shop My Style">
    <img src="images/c6.jpg" alt="Shop My Style">
    <img src="images/c4.jpg" alt="Shop My Style">
    <img src="images/s4.jpg" alt="Shop My Style">
    <img src="images/m3.jpg" alt="Shop My Style">

    <img src="images/h3.jpg" alt="For Him">
    <img src="images/p1.jpg" alt="For Him">
</div>

<!-- Wrap the cards in a container with an id -->
<div id="card-container" class="container my-4">
 <div class="row">
    <div class="col-4 px-5">
        <div class="card h-100 d-flex flex-column justify-content-center">
            <div class="d-flex justify-content-center">
                <img src="images/a20.jpg" style="height: 500px; width: 400px;" alt="Fall Wedding Dresses">
            </div>
            <div class="card-body d-flex flex-column align-items-center text-center">
                <h3 class="card-title" style="font-family: Palatino Linotype;">Trend Reports:</h3>
                <p>Stay updated with what's hot on the runways and in the streets.</p>
            </div>
        </div>
    </div>

    <div class="col-4 px-5">
        <div class="card h-100 d-flex flex-column justify-content-center">
            <div class="d-flex justify-content-center">
                <img src="images/a15.jpg" style="height: 500px; width: 400px;" alt="Fall Wedding Dresses">
            </div>

                <p>Tips on how to style your wardrobe, from capsule closets to seasonal must-haves.</p>
            </div>
        </div>
    </div>

    <div class="col-4 px-5">
        <div class="card h-100 d-flex flex-column justify-content-center">

                <p>Honest reviews of the latest collections, fashion events, and new brands.</p>
            </div>
        </div>
    </div>
 </div>
</div>



<script>
function showImage(id) {
    // Hide all images first
    var images = document.getElementsByClassName('image-container');
    for (var i = 0; i < images.length; i++) {
        images[i].style.display = 'none';
    }

    // Show the selected image
    document.getElementById(id).style.display = 'block';

    // Hide the card container
    document.getElementById('card-container').style.display = 'none';
}
</script>

<script type="text/javascript" src="bootstrap/js/bootstrap.bundle.min.js"></script>
